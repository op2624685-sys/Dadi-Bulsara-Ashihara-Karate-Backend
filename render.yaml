# =============================================================================
# Render Blueprint — https://render.com/docs/blueprint-spec
# -----------------------------------------------------------------------------
# Provisioned services:
#   * karate-web   : Web Service running the Dockerfile in this repo (Singapore)
#
# External services (NOT provisioned by Render — managed elsewhere):
#   * Postgres — Neon (https://neon.tech)        — credentials via dashboard
#   * Redis    — Upstash (https://upstash.com)   — credentials via dashboard
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. Render dashboard: New → Blueprint → pick this repo.
#   3. After the first deploy, open karate-web → Environment and paste the
#      Neon / Upstash values into the `sync: false` env vars listed below.
# =============================================================================

services:
  # ---- Web service : Spring Boot fat-jar ------------------------------------
  - type: web
    name: karate-web
    runtime: docker
    plan: starter          # change to "standard" / "pro" as traffic grows
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    numInstances: 1

    envVars:
      # ---- Spring profile --------------------------------------------------
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ---- Database : Neon Postgres ----------------------------------------
      # Paste the JDBC URL from Neon into DB_URL_KARATE on the first deploy,
      # e.g. jdbc:postgresql://ep-xxx.ap-southeast-1.aws.neon.tech/karate?sslmode=require
      - key: DB_URL_KARATE
        sync: false
      - key: DB_USERNAME_KARATE
        sync: false
      - key: DB_PASSWORD_KARATE
        sync: false

      # ---- Cache : Upstash Redis --------------------------------------------
      # Upstash exposes rediss://default:<password>@<host>:<port>
      # Spring Data Lettuce handles rediss:// (TLS) natively — no extra config.
      - key: REDIS_URL
        sync: false

      # ---- Security / auth --------------------------------------------------
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JWT_SECRET_KARATE
        sync: false
      - key: APP_SECURITY_CSRF_ENABLED
        value: "true"
      - key: COOKIES_SECURE
        value: "true"

      # ---- CORS / frontend --------------------------------------------------
      # Single source of truth for the frontend URL. application.yaml derives
      # RESET_BASE_URL and VERIFY_BASE_URL from this via SpEL placeholders.
      - key: CORS_ORIGINS
        sync: false

      # ---- Mail (Gmail SMTP) -------------------------------------------------
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # ---- Storage : Cloudinary (enabled) -----------------------------------
      - key: CLOUDINARY_ENABLED_KARATE
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- Admin seed (dev convenience — replace before launch) ------------
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false

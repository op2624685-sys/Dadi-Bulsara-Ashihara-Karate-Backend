spring:
  application:
    name: karate

  data:
    redis:
      url: ${REDIS_URL}
      repositories:
        enabled: false   # We use Redis only for caching, not as a data store.
                         # This stops Spring Data Redis from scanning JPA repos.

  datasource:
    url: ${DB_URL_KARATE}
    username: ${DB_USERNAME_KARATE}
    password: ${DB_PASSWORD_KARATE}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  mail:
    # Resend SMTP (https://resend.com) — port 465 with SSL, more reliable on
    # Render than Gmail SMTP (port 587 is blocked / slow on cloud providers).
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          ssl:
            enable: ${MAIL_SSL:true}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
    multipart:
      # Hard cap on a single uploaded image and on the whole request.
      # Exceeding these raises MaxUploadSizeExceededException -> HTTP 413
      # (handled by GlobalExceptionHandler).
      max-file-size: 8MB
      max-request-size: 10MB

app:
  security:
    csrf-enabled: false   # dev: CSRF off; set true (or APP_SECURITY_CSRF_ENABLED=true) for deployment
  jwt:
    # Must be at least 32 bytes (256 bits) for HS256. Override in production.
    secret: ${JWT_SECRET_KARATE}
    access-ttl: PT15M          # 15 minutes (ISO-8601 duration)
    refresh-ttl: P30D          # 30 days
    issuer: karate-federation
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@dadibulsara.local}
    # Derived from CORS_ORIGINS so prod only needs CORS_ORIGINS in the dashboard.
    # Manually exporting RESET_BASE_URL / VERIFY_BASE_URL still overrides these.
    reset-base-url: ${RESET_BASE_URL:#{'${CORS_ORIGINS:http://localhost:3000}' + '/reset-password'}}
    verify-base-url: ${VERIFY_BASE_URL:#{'${CORS_ORIGINS:http://localhost:3000}' + '/verify-email'}}
  # Email-verification link lifetime. Keep this short (default 15m) so an
  # unverified account isn't left exposed for long. ISO-8601 duration.
  verification-ttl: ${VERIFICATION_TTL:PT15M}
  cookies:
    secure: ${COOKIES_SECURE:false}        # set to true behind HTTPS in prod

  # Image storage. Exactly one provider is active, chosen by its `enabled` flag:
  #   * app.storage.cloudinary.enabled=true  -> Cloudinary
  #   * app.storage.r2.enabled=true           -> Cloudflare R2 (S3-compatible)
  #   * neither enabled                        -> local ./uploads dev fallback
  # The R2_*_KARATE / CLOUDINARY_*_KARATE values are loaded from .env by
  # KarateApplication#main.
  storage:
    r2:
      enabled: ${R2_ENABLED_KARATE:false}
      account-id: ${R2_ACCOUNT_ID_KARATE:}
      access-key: ${R2_ACCESS_KEY_KARATE:}
      secret-key: ${R2_SECRET_KEY_KARATE:}
      bucket: ${R2_BUCKET_KARATE:}
      public-url: ${R2_PUBLIC_URL_KARATE:}
    cloudinary:
      enabled: ${CLOUDINARY_ENABLED_KARATE:true}
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}

  # Seed credentials for the developer admin account (AdminUserSeeder).
  # Override via ADMIN_SEED_EMAIL / ADMIN_SEED_PASSWORD env vars.
  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@dadibulsara.local}
    seed-password: ${ADMIN_SEED_PASSWORD:ChangeMe123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

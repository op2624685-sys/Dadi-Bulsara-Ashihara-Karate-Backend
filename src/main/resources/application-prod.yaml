spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: framework

app:
  security:
    csrf-enabled: true
  cookies:
    secure: true
    # Cross-site deployment (frontend on Vercel, backend on Railway) requires
    # SameSite=None; Secure so the browser sends the auth cookies on the next
    # API call. The XSRF double-submit (still enabled via csrf-enabled: true)
    # is the CSRF defence in this configuration.
    same-site: None

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.hibernate.SQL: WARN
